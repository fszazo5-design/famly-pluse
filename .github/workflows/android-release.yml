name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build React frontend
        env:
          VITE_HELP_VIDEO_URL: ${{ secrets.VITE_HELP_VIDEO_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDJqCntqnXwuu1Pw8VfmVvyAlg6zieQ-1U' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'myfamly-6035d.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'myfamly-6035d' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'myfamly-6035d.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '103503538294' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:103503538294:android:82e3eb1ec7121916d01757' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure Firebase Android app
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDJqCntqnXwuu1Pw8VfmVvyAlg6zieQ-1U' }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'myfamly-6035d' }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'myfamly-6035d.firebasestorage.app' }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '103503538294' }}
          FIREBASE_ANDROID_APP_ID: '1:103503538294:android:82e3eb1ec7121916d01757'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "project_info": {
                  "project_number": os.environ["FIREBASE_MESSAGING_SENDER_ID"],
                  "project_id": os.environ["FIREBASE_PROJECT_ID"],
                  "storage_bucket": os.environ["FIREBASE_STORAGE_BUCKET"],
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": os.environ["FIREBASE_ANDROID_APP_ID"],
                      "android_client_info": {"package_name": "com.guardian.safety"},
                  },
                  "api_key": [{"current_key": os.environ["FIREBASE_API_KEY"]}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}},
              }],
              "configuration_version": "1",
          }
          Path("android/app/google-services.json").write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          cat > android/keystore.properties <<EOF
          storeFile=$ANDROID_KEYSTORE_PATH
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          test -n '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          test -n '${{ secrets.ANDROID_KEY_ALIAS }}'
          test -n '${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Build signed release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify signing and outputs
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/apk/release/app-release.apk >/dev/null
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: guardian-android-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/**

      - name: Clean signing material
        if: always()
        run: rm -f android/release.keystore android/keystore.properties android/app/google-services.json
