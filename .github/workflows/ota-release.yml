name: Frontend OTA Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'

permissions:
  contents: write

jobs:
  publish-ota:
    name: Build and publish frontend OTA bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build React frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://famlypulse.vercel.app' }}
          VITE_HELP_VIDEO_URL: ${{ secrets.VITE_HELP_VIDEO_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_OTA_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Create OTA archive
        run: |
          cd dist
          zip -qr ../dist.zip .
          test -s ../dist.zip

      - name: Copy latest production Android artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ota-assets
          latest_android_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.publishedAt) | last.tagName')
          if [ -n "$latest_android_tag" ] && [ "$latest_android_tag" != "null" ]; then
            gh release download "$latest_android_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'app-release.apk' --pattern 'app-release.aab' --dir ota-assets --clobber
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_TAG: ota-${{ github.run_number }}
        run: |
          release_assets=(dist.zip)
          [ -f ota-assets/app-release.apk ] && release_assets+=(ota-assets/app-release.apk)
          [ -f ota-assets/app-release.aab ] && release_assets+=(ota-assets/app-release.aab)
          gh release create "$OTA_TAG" "${release_assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Frontend OTA $OTA_TAG" \
            --notes "Frontend OTA bundle from commit $GITHUB_SHA. APK/AAB are copied from the latest production release for convenience; native Android changes still require a new APK/AAB release."
