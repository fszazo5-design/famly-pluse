name: Frontend OTA Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'

permissions:
  contents: write

jobs:
  publish-ota:
    name: Build and publish frontend OTA bundle
    if: ${{ !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build React frontend
        env:
          VITE_HELP_VIDEO_URL: ${{ secrets.VITE_HELP_VIDEO_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDJqCntqnXwuu1Pw8VfmVvyAlg6zieQ-1U' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'myfamly-6035d.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'myfamly-6035d' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'myfamly-6035d.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '103503538294' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:103503538294:android:82e3eb1ec7121916d01757' }}
          VITE_OTA_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Create OTA archive
        run: |
          cd dist
          zip -qr ../dist.zip .
          test -s ../dist.zip

      - name: Copy latest production Android artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ota-assets
          latest_android_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.publishedAt) | last.tagName')
          if [ -n "$latest_android_tag" ] && [ "$latest_android_tag" != "null" ]; then
            gh release download "$latest_android_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'app-release.apk' --pattern 'app-release.aab' --dir ota-assets --clobber
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_ota_number=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | test("^ota-[0-9]+$")) | (.tagName | sub("^ota-"; "") | tonumber)] | max // 0')
          OTA_TAG="ota-$((latest_ota_number + 1))"
          release_assets=(dist.zip)
          [ -f ota-assets/app-release.apk ] && release_assets+=(ota-assets/app-release.apk)
          [ -f ota-assets/app-release.aab ] && release_assets+=(ota-assets/app-release.aab)
          gh release create "$OTA_TAG" "${release_assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Frontend OTA $OTA_TAG" \
            --notes "Frontend OTA bundle from commit $GITHUB_SHA. APK/AAB are copied from the latest production release for convenience; native Android changes still require a new APK/AAB release."
